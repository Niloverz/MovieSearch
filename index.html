<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App | Niloverz</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div class="container">
        <header>
            <h1>Movie Search</h1>
            <p class="subtitle">Temukan informasi film favoritmu</p>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
            <button id="searchBtn">Cari</button>
            <button id="homeBtn" class="btn-home">Beranda</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-sort="popular">Populer</button>
            <button class="filter-btn" data-sort="latest">Terbaru</button>
            <button class="filter-btn" data-sort="oldest">Terlama</button>
            <button class="filter-btn" data-sort="rating">Rating Tertinggi</button>

               <div class="genre-dropdown">
                    <button id="genreBtn" class="filter-btn">Genre ▼</button>
                    <div id="genreMenu" class="genre-menu hidden">
                    </div>
                </div>
            </div>
        </div>

        <div id="loadingState" class="loading hidden">
            <div class="spinner"></div>
            <p>Mencari film...</p>
        </div>

        <div id="errorState" class="error hidden">
            <p>Film tidak ditemukan. Coba kata kunci lain.</p>
        </div>

        <div id="movieGrid" class="movie-grid">
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
